# Omarchy Quattro shell surfaces for Dos-Moos.
# The palette mirrors colors.toml; [launcher] ports the supported parts of
# the current Walker design from current/theme/walker.css.

[bar]
background       = "#131516"
background-alpha = 1.0
text             = "#F8EBE3"
active           = "#F0334A"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "#A5B5AB"
active-border-foreground = "#F8EBE3"

[controls]
normal-color        = "#F8EBE3"
normal-fill-alpha   = 0.04
normal-border       = "#F8EBE3"
normal-border-width = 1
normal-border-alpha = 0.4

hover-cursor-color        = "#F8EBE3"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "#F8EBE3"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.25

focus-color        = "#F8EBE3"
focus-fill-alpha   = 0.08
focus-border       = "#F8EBE3"
focus-border-width = 1
focus-border-alpha = 0.25

selected-color        = "#F8EBE3"
selected-fill-alpha   = 0.18
selected-border       = "#F8EBE3"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale           = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#131516"
background-alpha = 1.0
text             = "#F8EBE3"
border           = "hyprland.active-border"
border-alpha     = 1.0

[tooltip]
background       = "#131516"
background-alpha = 0.97
text             = "#F8EBE3"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#131516"
background-alpha = 1.0
text             = "#F8EBE3"
border           = "hyprland.active-border"
border-alpha     = 1.0
countdown        = "#819890"

[launcher]
background                = "#131516"
background-alpha          = 0.80
text                      = "#F8EBE3"
border                    = "#3A4849"
border-alpha              = 1.0
border-width              = 1.5
scrim                     = "#131516"
scrim-alpha               = 0.0
selected-background       = "#819890"
selected-background-alpha = 0.18
selected-text             = "#819890"
selected-border           = "#819890"
selected-border-alpha     = 0.0
selected-border-width     = 0

[menu]
background                = "#131516"
background-alpha          = 1.0
text                      = "#F8EBE3"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#131516"
scrim-alpha               = 0.5
selected-background       = "#F8EBE3"
selected-background-alpha = 0.08
selected-text             = "#819890"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.25

[polkit]
background       = "#131516"
background-alpha = 1.0
text             = "#F8EBE3"
text-error       = "#F0334A"
border           = "hyprland.active-border"
border-error     = "#F0334A"
border-alpha     = 1.0
scrim            = "#131516"
scrim-alpha      = 0.5
accent           = "#819890"

[lock]
background       = "#131516"
background-alpha = 0.8
text             = "#F8EBE3"
placeholder      = "#A5B5AB"
text-error       = "#F0334A"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#F0334A"
border-alpha     = 1.0
selection        = "#819890"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#131516"
scrim-alpha             = 0.5
text                    = "#F8EBE3"
selected-border         = "#819890"
selected-border-alpha   = 1.0
unselected-border       = "#F8EBE3"
unselected-border-alpha = 0.28
